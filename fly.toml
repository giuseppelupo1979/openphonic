# fly launch --copy-config --no-deploy && fly volumes create openphonic_data --size 10
# fly secrets set APP_PASSWORD=... && fly deploy
app = "openphonic"
primary_region = "fra"

[build]

[env]
  PORT = "8000"
  WORKERS = "2"

[[mounts]]
  source = "openphonic_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
